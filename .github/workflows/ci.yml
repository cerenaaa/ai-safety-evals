name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pytest
      - run: python -c "from evals.toxicity_eval import score_toxicity; r=score_toxicity('Hello world'); assert not r.is_toxic; print('toxicity OK')"
      - run: python -c "from datasets.safety_prompts import ALL_PROMPTS; assert len(ALL_PROMPTS)==4; print('prompts OK')"
      - run: python run_evals.py --suite quick
